[package]
name = "econ-cli"
description = "Headless runner: SIM model, golden-run checks, scale benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "econ-cli"
path = "src/main.rs"

[dependencies]
econ-types.workspace = true
econ-core.workspace = true
econ-io = { workspace = true, features = ["world"] }
econ-popgen.workspace = true
econ-scenario.workspace = true
# `play`'s outputs (feature `levers`).
serde_json = { workspace = true, optional = true }
econ-rng.workspace = true

[features]
# `play` (spec game/lever-system, headless play), with the lever system.
levers = ["econ-core/levers", "econ-io/levers", "dep:serde_json"]
# `calibrate` (spec game/calibration, "The report"; AC-CAL-04 to 06 and 08):
# the quiet baseline's report, as an API skeleton written with its
# acceptance tests before the code (ADR-0014); off by default.
calibration = ["levers", "econ-core/calibration", "econ-io/history"]
# The `people` configuration of the report: every M5 mechanic.
calibration-people = ["calibration", "econ-core/home_quality", "econ-core/education", "econ-core/approval"]

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"

[lints]
workspace = true
