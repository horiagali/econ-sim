[package]
name = "econ-cli"
description = "Headless runner: SIM model, golden-run checks, scale benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "econ-cli"
path = "src/main.rs"

[dependencies]
econ-types.workspace = true
econ-core.workspace = true
econ-io = { workspace = true, features = ["world"] }
econ-popgen.workspace = true
econ-scenario.workspace = true
econ-rng.workspace = true

[features]
# `play` (spec game/lever-system, headless play): the test writer's addition
# (ADR-0014) for AC-LEV-08; off until the lever system is implemented.
levers = ["econ-core/levers", "econ-io/levers"]

[lints]
workspace = true
