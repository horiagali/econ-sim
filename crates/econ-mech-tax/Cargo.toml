[package]
name = "econ-mech-tax"
description = "Taxation mechanics (specs: economy/taxation, economy/vat). VAT and the taxes on income."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
econ-types.workspace = true
econ-ledger.workspace = true

[features]
# Gates the acceptance test of the second reduced VAT rate (AC-VAT-06), written
# before the code (ADR-0014); on by default now that the code exists.
default = ["reduced-2", "taxation"]
reduced-2 = []
# Gates the acceptance tests of the taxes on income (AC-TAX-01..07), written
# before the code (ADR-0014); the implementation adds it to `default`.
taxation = []

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"

[lints]
workspace = true
