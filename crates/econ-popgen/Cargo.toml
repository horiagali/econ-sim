[package]
name = "econ-popgen"
description = "Population generator: starting population from census margins (spec: society/population-generator)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Each feature gates the acceptance tests of one stage: they were written
# before the stage (ADR-0014), and its implementation switched the feature on.
default = ["generator", "attributes", "jobs", "housing"]
generator = []
# Stage C: education and activity (spec society/population-attributes).
attributes = []
# Stage D: jobs (spec society/population-jobs).
jobs = []
# Stage E: locality size and tenure (spec society/population-housing).
housing = []

[dependencies]
econ-rng.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
required-features = ["generator"]

[lints]
workspace = true
