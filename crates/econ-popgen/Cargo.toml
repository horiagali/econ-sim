[package]
name = "econ-popgen"
description = "Population generator: starting population from census margins (spec: society/population-generator)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off until the generator is implemented: the acceptance tests need it.
# The implementation PR adds `default = ["generator"]`.
generator = []

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
required-features = ["generator"]

[lints]
workspace = true
