[package]
name = "econ-popgen"
description = "Population generator: starting population from census margins (spec: society/population-generator)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Gates the acceptance tests (they were written before the generator, ADR-0014).
default = ["generator"]
generator = []
# Off until stage C (education and activity, spec society/population-attributes)
# is implemented: its acceptance tests need it. The implementation PR adds it to `default`.
attributes = []
# The same for stage D (jobs, spec society/population-jobs).
jobs = []

[dependencies]
econ-rng.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
required-features = ["generator"]

[lints]
workspace = true
