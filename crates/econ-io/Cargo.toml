[package]
name = "econ-io"
description = "Saves, loading, migrations and replay (ADR-0011). Arrow lives here, never in econ-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
econ-core.workspace = true
econ-ledger.workspace = true
econ-popgen.workspace = true
econ-types.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-ipc.workspace = true
zip.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# `read_start_state`: a built scenario folder as the `StartState` of the
# `World` (spec game/world-loop). Off until the `World` exists (ADR-0014).
world = ["econ-core/world", "budget"]
# `budget`: the starting budget's loader (spec economy/budget-2021). Gates the
# acceptance tests, written before the code (ADR-0014); on by default since the
# implementation.
budget = []
default = ["budget"]
# `read_commands`: a commands file of headless play (spec game/lever-system),
# as an API skeleton before its acceptance tests (ADR-0014). Off by default.
levers = ["world", "econ-core/levers"]

[dev-dependencies]
# The reconciliation with the starting population (AC-BUD-09) builds the
# Romania scenario (a dev-dependency cycle, allowed for integration tests).
econ-scenario.workspace = true

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"

[lints]
workspace = true
