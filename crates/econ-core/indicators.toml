# The statistics registry (spec game/statistics-registry, roadmap M6): one
# entry per indicator, read by scripts/codegen_indicators.py into
# src/indicators_gen.rs and ui/src/generated/indicators.json.
# `derive`: ratio(a, b), real(a), growth_yoy(a), growth_mom(a), per_capita(a).
# `feature`: the econ-core feature that computes the source ("" = always).

[[indicator]]
id = "gdp.nominal"
glossary = "gdp_nominal"
unit = "bani"
period = "month"
breakdowns = []
aggregate = "none"
derive = ""
feature = ""
views = ["overview"]
headline = true
milestone = "alpha"
status = "active"
source = "game/world-loop: months()[t].gdp_production"

