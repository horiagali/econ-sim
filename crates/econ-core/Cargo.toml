[package]
name = "econ-core"
description = "Simulation state, phases and the step API. Spike 2: the Godley-Lavoie SIM model on the real ledger."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
econ-types.workspace = true
econ-num.workspace = true
econ-ledger.workspace = true
econ-rng.workspace = true
# Spike wiring only: the scale world calls the VAT mechanic directly. In the real
# core, mechanics crates depend on econ-core (ADR-0005), not the other way round.
econ-mech-tax.workspace = true
# The M2 mechanics the `World` runs (feature `world`).
econ-mech-households = { workspace = true, optional = true }
econ-mech-labour = { workspace = true, optional = true }
econ-mech-production = { workspace = true, optional = true }
econ-mech-prices = { workspace = true, optional = true }
econ-mech-transfers = { workspace = true, optional = true }
econ-popgen = { workspace = true, optional = true }
# Roadmap M5's demographic tables and the career proxy (feature `world`).
econ-mech-demography = { workspace = true, optional = true }
# The M3 mechanics (features `banking`, `monetary`, `fiscal`, `trade`).
econ-mech-banking = { workspace = true, optional = true }
econ-mech-monetary = { workspace = true, optional = true }
econ-mech-fiscal = { workspace = true, optional = true }
econ-mech-trade = { workspace = true, optional = true }
econ-mech-investment = { workspace = true, optional = true }
# Migration (feature `migration`, roadmap M5).
econ-mech-migration = { workspace = true, optional = true }
# The lever registry (feature `levers`).
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
# The acceptance tests of the `World` build the Romania scenario and read it
# back as a `StartState` (a dev-dependency cycle, allowed for integration tests).
econ-scenario.workspace = true
econ-io.workspace = true
serde_json.workspace = true

[features]
default = [
    "world",
    "fiscal",
    "pay_day",
    "banking",
    "monetary",
    "trade",
    "investment",
    "revenue",
    # The lever system and the policy-scenario suite, every scenario's
    # lever wired (roadmap M4, closed 2026-10-26).
    "lever_policy_rate",
    "lever_monetary_financing",
    "lever_fx_devaluation",
    "lever_fuel_price",
]
# Gates the `World` of spec game/world-loop and its acceptance tests (AC-WLD-*
# and the owed `[sim]` criteria of the four M2 mechanics), written before the
# code (ADR-0014); the implementation adds it to `default`.
world = [
    "dep:econ-mech-households",
    "dep:econ-mech-labour",
    "dep:econ-mech-production",
    "dep:econ-mech-prices",
    "dep:econ-mech-transfers",
    "dep:econ-popgen",
    "dep:econ-mech-demography",
    # `econ_io::read_start_state`, for the tests only.
    "econ-io/world",
]

# The read-only record of the latest pay day (`World::pay_slips`) and the
# layoff edit, for the `[sim]` criteria of taxation and social transfers
# (AC-TAX-08, 09, AC-ST-05..08). Test-writer additions to the `World`
# (ADR-0014); the implementation adds them to `default`.
pay_day = ["world"]
# The M3 mechanics on the `World` (specs economy/money-banking,
# monetary-policy, fiscal-policy, trade-fx): their parameters, read-only
# state and start edits, as API skeletons written with their acceptance
# tests before the code (ADR-0014); the implementation adds them to `default`.
banking = ["world", "dep:econ-mech-banking"]
fiscal = ["world", "dep:econ-mech-fiscal"]
monetary = ["banking", "fiscal", "dep:econ-mech-monetary"]
trade = ["world", "dep:econ-mech-trade"]
# Investment and capital (spec economy/investment-capital): the capital book,
# profit and dividends on the `World`. Written before its acceptance tests by
# the owner's decision (2026-10-21); on by default since M3 closed
# (2026-10-22).
investment = ["fiscal", "dep:econ-mech-investment"]
# The rest of 2021's revenue, benefits and imputed rent (specs economy/excise,
# eu-funds, government-revenue-2021, imputed-rent). Built before its tests by
# the owner's decision (2026-10-21); on by default since M3 closed
# (2026-10-22).
revenue = ["fiscal"]
# Demographics and the household life cycle (specs economy/demographics and
# society/households-lifecycle, roadmap M5): the People phase's parameters,
# read-only state and monthly report, the retirement age in force, the
# year's mortality table and the start edit of AC-DEM-19, as API skeletons
# written with their acceptance tests before the code (ADR-0014); every body
# is `unimplemented!` until the code exists. Off by default; the
# implementation adds them to `default` once their tests pass. The criteria
# run under the 2021 law of `law.json` with every M3 and M4 feature, so it
# needs the lever system, trade and the central bank. `lifecycle` turns on
# the household life cycle's `[sim]` criteria (AC-HHL-05 to 10).
demography = ["levers", "trade", "monetary"]
lifecycle = ["demography"]
# The lever system (spec game/lever-system, roadmap M4): the registry
# (`levers.toml`), commands, validation, the law in force and the command log,
# as an API skeleton written before its acceptance tests (ADR-0014); every body
# is `unimplemented!` until they exist. Off by default. With it, the test
# writer's additions for its acceptance tests (ADR-0014): econ-io's scenario
# law, saves and commands files, and the labour market's pay and job choice
# (AC-LM-11, AC-LM-12).
levers = [
    "world",
    "fiscal",
    "dep:serde",
    "dep:toml",
    "econ-io/levers",
    "econ-mech-labour/pay_choice",
]
# The policy-scenario suite (spec game/policy-scenarios, AC-POL-*): the
# harness, the baseline and placebo runs, and the scenarios whose levers are
# active today (S2, S3, S4, S7, S8), the three-scale and mutation criteria.
# Test writer's addition (ADR-0014); the implementation adds it to `default`
# once they pass.
policy = ["levers", "trade", "monetary"]
# One per scenario whose lever is not wired yet (S1, S5, S6, S9): it turns on
# that scenario's test and includes the scenario in AC-POL-10 and 11. The PR
# that wires the lever adds its feature to `default`.
lever_policy_rate = ["policy"]
lever_monetary_financing = ["policy"]
lever_fx_devaluation = ["policy"]
lever_fuel_price = ["policy"]

# Roadmap M5, written with their acceptance tests before the code (ADR-0014):
# API skeletons whose bodies are `unimplemented!`, off by default; the
# implementation adds each to `default` once its tests pass.
# Migration, the diaspora and remittances (spec
# economy/migration-remittances, AC-MIG-05 to 17): the month's flows, the
# diaspora, the `abroad` column and the start edits of the counterfactuals.
# The criteria compare runs and set levers, so it needs the lever system and
# trade (the exchange rate, the current account).
migration = ["levers", "trade", "lifecycle", "dep:econ-mech-migration"]
# Education's first version (spec society/education, AC-EDU-01 to 09): the
# June and August closes, `enrolled` and `study_year`, the yearly report.
education = ["levers", "econ-io/education"]
# Approval's first version (spec society/opinion-approval, AC-APP-01 to 08):
# the pure rule and the per-person approval on the `World`. It reads the
# households' recent real income of poverty and inequality.
approval = ["poverty", "levers", "trade"]
# Poverty and inequality indicators (spec society/poverty-inequality,
# AC-POV-01 to 09).
poverty = ["levers"]

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"

[lints]
workspace = true
