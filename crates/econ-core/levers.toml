# The lever registry (spec game/lever-system, ADR-0018): one [[lever]] table per lever.
# Values are the shape's integers: rate = basis points, money = bani, number = a count.
# A lever has no default here; its starting value is in python/pipeline/fixtures/law2021_ro.json.
# `key` names a key table: a scenario table (industries, budget_lines, public_units) or one of
# [key_tables] below; `keys` is the allowed subset. `range` of a schedule bounds each rate and
# `rows` the number of rows. `# range: judgement` marks a range that is a judgement, not law.
# Generated from this file by scripts/codegen_levers.py (`just codegen`): levers_gen.rs, the UI list, the test list.

[key_tables]
dependants = ["0", "1", "2", "3", "4_or_more"]
sexes = ["F", "M"]
household_sizes = ["1", "2", "3", "4", "5"]
ui_share_bands = ["3y", "5y", "10y", "20y"]
ui_duration_bands = ["1y", "5y", "10y"]
blocs = ["eu", "non_eu"]
fuels = ["oil", "gas", "coal"]

