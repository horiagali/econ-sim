[package]
name = "econ-py"
description = "Python bindings (PyO3) for calibration and analysis runs. Built with maturin; not a workspace member so plain `cargo` builds never need Python."
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "econ_py"
crate-type = ["cdylib"]

[dependencies]
econ-core = { path = "../econ-core" }
econ-types = { path = "../econ-types" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310", "generate-import-lib"] }

[workspace]
