name: nightly
# The long runs that do not fit a pull request's CI (roadmap M4 exit: "each
# scenario test passes at three scales; a mutated rule (wrong sign) makes at
# least one of them fail"): the policy-scenario suite and the World at 1:10,
# and the policy suite's mutation check (AC-POL-11, `just policy-mutants`).
on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  one-in-ten:
    # AC-POL-10 at 1:10 (every wired scenario, the placebo, the checks of
    # every day) and AC-WLD-03 at 1:10, in a release build, one at a time.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          save-if: false
      - name: the policy suite and the World at 1:10
        run: cargo test --release -p econ-core --test acceptance -- --include-ignored --test-threads=1 --exact policy::scales::ac_pol_10_one_in_ten world::ac_wld_03_one_in_ten

  policy-mutants:
    # AC-POL-11: each sign mutant MUT-1..3 must fail its scenario at 1:1000.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-mutants
      - name: the mutation check
        run: just policy-mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-mutants
          path: target/policy-mutants/mutants.out
          if-no-files-found: ignore
