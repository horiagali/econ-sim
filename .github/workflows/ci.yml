name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # A pull request that touches only docs and Markdown skips the Rust and
    # UI jobs; docs.yml still checks the index and traceability. The glossary
    # generates code, so it counts as code. Pushes to main run everything.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' || steps.filter.outputs.glossary == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            glossary:
              - 'docs/glossary.md'

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1   # reads rust-toolchain.toml
        with:
          components: rustfmt, clippy
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: determinism lint canary
        run: python scripts/lint_canary.py
      - name: glossary codegen is up to date
        run: python scripts/codegen_glossary.py --check
      - name: data pipeline tests
        run: python -m unittest discover -s python/pipeline/tests
      - name: protect-paths hook tests
        run: python -m unittest discover -s scripts/tests
      - name: differential SIM and PC test (Rust vs Python reference)
        run: |
          cargo build -q -p econ-cli
          python python/reference/diff_sim.py
      - name: golden run
        run: cargo run -q -p econ-cli -- sim --ticks 200 --check-golden tests/golden/sim_200.hashes
      - name: state hashes for cross-platform comparison
        run: cargo run -q -p econ-cli -- sim --ticks 200 --hashes > hashes-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-linux
          path: hashes-linux.txt

  windows:
    # Only when core code changes (ADR-0010 CI budget).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            core:
              - 'crates/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            host:
              - 'crates/**'
              - 'ui/src-tauri/**'
              - 'rust-toolchain.toml'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.changes.outputs.core == 'true' || steps.changes.outputs.host == 'true'
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.core == 'true' || steps.changes.outputs.host == 'true'
        with:
          workspaces: |
            .
            ui/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: tests
        if: steps.changes.outputs.core == 'true'
        run: cargo test --workspace
      - name: state hashes
        if: steps.changes.outputs.core == 'true'
        shell: bash
        run: cargo run -q -p econ-cli -- sim --ticks 200 --hashes > hashes-windows.txt
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.core == 'true'
        with:
          name: hashes-windows
          path: hashes-windows.txt
      - name: Tauri host compiles (not a workspace member)
        if: steps.changes.outputs.host == 'true'
        run: cargo check --manifest-path ui/src-tauri/Cargo.toml --locked

  scales:
    # The World at three population scales in a release build (roadmap M2)
    # and the policy suite at two (roadmap M4):
    # its acceptance tests at 1:1000 and 1:100, the ignored 1:10 run and the
    # time budget of AC-WLD-10, one at a time so the timing is not shared.
    # `world::` also matches `transfers_world::`, whose ignored tests are
    # owed (AC-ST-08), so that module is skipped.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: the World at 1:1000, 1:100 and 1:10
        run: "cargo test --release -p econ-core --test acceptance -- --include-ignored --test-threads=1 --skip transfers_world:: world::"
      # The policy-scenario suite (spec game/policy-scenarios): every
      # scenario and AC-POL-10 at 1:1000 and 1:100; its 1:10 run and the
      # mutation check are nightly (nightly.yml).
      - name: the policy suite at 1:1000 and 1:100
        run: cargo test --release -p econ-core --test acceptance -- --test-threads=1 policy::

  ui:
    # The thin UI's frontend type-checks and builds (the Tauri host is
    # checked by the windows job).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  determinism:
    # Linux and Windows must produce byte-identical state hashes (ADR-0006).
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: hashes
      - name: compare
        run: |
          if [ ! -f hashes/hashes-windows/hashes-windows.txt ]; then echo "Windows job skipped (no core changes)"; exit 0; fi
          tr -d '\r' < hashes/hashes-windows/hashes-windows.txt > w.txt
          diff hashes/hashes-linux/hashes-linux.txt w.txt && echo "identical"

  licences:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans
