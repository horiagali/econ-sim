# Calibration targets (spec game/calibration, ADR-0009: targets as code).
# One [[target]] per check: a registry indicator at a key, a metric over a
# window of months (from 0 = December 2021, both ends included) and a band in
# the indicator's unit (ppm, bani, persons). Bands accepted by the owner on
# 2026-11-01 as a starting point. A target the spec states for several
# windows ("each decade") or metrics (L-03's min and max) is one target per
# part, with a suffix.

# --- Levels: core, years 2 and 3 (months 12 to 35) unless stated ---

[[target]]
id = "L-01"
indicator = "labour.unemployment_rate"
key = "national"
metric = "mean"
window = [12, 35]
band = [45_000, 75_000]
config = "core"
source = "Eurostat une_rt_a, Romania 2021: 5.6%"

[[target]]
id = "L-02"
indicator = "prices.inflation_yoy"
key = "national"
metric = "mean"
window = [12, 35]
band = [15_000, 50_000]
config = "core"
source = "BNR target 2.5% +- 1 point"
note = "a quiet run has no 2022 energy shock"

[[target]]
id = "L-03-min"
indicator = "fx.eur_lei"
key = "national"
metric = "min"
window = [12, 35]
band = [4_500_000, 5_500_000]
config = "core"
source = "BNR 2021 average 4.92, end of year 4.95"

[[target]]
id = "L-03-max"
indicator = "fx.eur_lei"
key = "national"
metric = "max"
window = [12, 35]
band = [4_500_000, 5_500_000]
config = "core"
source = "BNR 2021 average 4.92, end of year 4.95"

[[target]]
id = "L-04"
indicator = "money.policy_rate"
key = "national"
metric = "mean"
window = [12, 35]
band = [10_000, 60_000]
config = "core"
source = "1.75% at the start; the rule's neutral rate with 2.5% inflation"

[[target]]
id = "L-05"
indicator = "gdp.growth_yoy"
key = "national"
metric = "mean"
window = [12, 119]
band = [10_000, 45_000]
config = "core"
source = "European Commission potential growth for Romania 2022-2030, about 3 to 4%"
note = "years 2 to 10; below while productivity growth is 0"

[[target]]
id = "L-06"
indicator = "budget.deficit"
key = "national"
metric = "ratio(gdp.nominal)"
window = [12, 35]
band = [30_000, 80_000]
config = "core"
source = "2021 deficit 7.1% of GDP (ESA)"

[[target]]
id = "L-07"
indicator = "trade.current_account"
key = "national"
metric = "ratio(gdp.nominal)"
window = [12, 35]
band = [-80_000, -20_000]
config = "core"
source = "BNR 2021: -7.2%; 2015-2019: -0.8% to -4.9%"

[[target]]
id = "L-08"
indicator = "debt.gdp_ratio"
key = "national"
metric = "at"
window = [0, 0]
band = [450_000, 530_000]
config = "core"
source = "Eurostat 2021: 48.9%"
note = "the opening book against month 0's annualised GDP"

[[target]]
id = "L-09"
indicator = "gdp.consumption"
key = "national"
metric = "ratio(gdp.nominal)"
window = [12, 35]
band = [580_000, 660_000]
config = "core"
source = "INS 2021: household final consumption about 62% of GDP"

[[target]]
id = "L-10"
indicator = "wages.bill"
key = "national"
metric = "ratio(gdp.nominal)"
window = [12, 35]
band = [320_000, 420_000]
config = "core"
source = "INS 2021: compensation of employees about 37% of GDP"

