# Datasets to fetch. Each carries a licence tag kept in provenance (ADR-0012).
# Eurostat dissemination API, JSON-stat 2.0.

[[dataset]]
id = "ro_pop_county_age_sex"
source = "eurostat"
code = "demo_r_pjangrp3"           # population on 1 January by age group, sex and NUTS 3 region
filters = { geo = ["RO111", "RO113", "RO321"], time = ["2023"], unit = ["NR"] }
licence = "eurostat-reuse"          # commercial reuse allowed with attribution; non-EU data excluded

[[dataset]]
id = "ro_gdp_nuts3"
source = "eurostat"
code = "nama_10r_3gdp"             # GDP at current market prices by NUTS 3 region
filters = { geo = ["RO111", "RO113", "RO321"], time = ["2022"], unit = ["MIO_EUR"] }
licence = "eurostat-reuse"

# Census 2021 round (reference date 1 December 2021), all 42 counties. Inputs of
# normalise_census.py and the population generator (spec society/population-generator).
[[dataset]]
id = "ro_census2021_persons_hhstatus"
source = "eurostat"
code = "cens_21cobhs_r3"           # population by country of birth, age group, household status and NUTS 3 region
filters = { c_birth = ["TOTAL"], unit = ["NR"], geo = ["RO111", "RO112", "RO113", "RO114", "RO115", "RO116", "RO121", "RO122", "RO123", "RO124", "RO125", "RO126", "RO211", "RO212", "RO213", "RO214", "RO215", "RO216", "RO221", "RO222", "RO223", "RO224", "RO225", "RO226", "RO311", "RO312", "RO313", "RO314", "RO315", "RO316", "RO317", "RO321", "RO322", "RO411", "RO412", "RO413", "RO414", "RO415", "RO421", "RO422", "RO423", "RO424"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_census2021_households_size"
source = "eurostat"
code = "cens_21hhcs_r3"            # private households by household composition, size and NUTS 3 region
filters = { hhcomp = ["TOTAL"], geo = ["RO111", "RO112", "RO113", "RO114", "RO115", "RO116", "RO121", "RO122", "RO123", "RO124", "RO125", "RO126", "RO211", "RO212", "RO213", "RO214", "RO215", "RO216", "RO221", "RO222", "RO223", "RO224", "RO225", "RO226", "RO311", "RO312", "RO313", "RO314", "RO315", "RO316", "RO317", "RO321", "RO322", "RO411", "RO412", "RO413", "RO414", "RO415", "RO421", "RO422", "RO423", "RO424"] }
licence = "eurostat-reuse"

# Census 2021 round, development regions (NUTS 2). Inputs of
# normalise_census_attributes.py (spec society/population-attributes).
[[dataset]]
id = "ro_census2021_activity_age"
source = "eurostat"
code = "cens_21a_r2"               # population by current activity status, single year of age, sex and NUTS 2 region
filters = { sex = ["F", "M"], unit = ["NR"], geo = ["RO11", "RO12", "RO21", "RO22", "RO31", "RO32", "RO41", "RO42"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_census2021_activity_education"
source = "eurostat"
code = "cens_21ae_r2"              # population by activity status, age group, educational attainment, sex and NUTS 2 region
filters = { sex = ["F", "M"], unit = ["NR"], geo = ["RO11", "RO12", "RO21", "RO22", "RO31", "RO32", "RO41", "RO42"] }
licence = "eurostat-reuse"

# Census 2021 round, development regions (NUTS 2), and the EU Labour Force Survey 2021.
# Inputs of normalise_census_jobs.py (spec society/population-jobs).
[[dataset]]
id = "ro_census2021_employment_industry"
source = "eurostat"
code = "cens_21empn_r2"            # population by status in employment, age group, economic activity (NACE Rev. 2), sex and NUTS 2 region
filters = { sex = ["F", "M"], unit = ["NR"], geo = ["RO11", "RO12", "RO21", "RO22", "RO31", "RO32", "RO41", "RO42"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_census2021_employment_occupation"
source = "eurostat"
code = "cens_21empo_r2"            # population by status in employment, age group, occupation (ISCO-08), sex and NUTS 2 region
filters = { sex = ["F", "M"], unit = ["NR"], geo = ["RO11", "RO12", "RO21", "RO22", "RO31", "RO32", "RO41", "RO42"] }
licence = "eurostat-reuse"

# EU-27 totals, not Romania: most cells of the Romanian tables are not published
# (too few respondents). Only proportions are used (see normalise_census_jobs.py).
[[dataset]]
id = "eu_lfs2021_occupation_industry"
source = "eurostat"
code = "lfsa_eisn2"                # employed persons by occupation and economic activity (NACE Rev. 2 sections)
filters = { geo = ["EU27_2020"], time = ["2021"], age = ["Y_GE15"], sex = ["F", "M"] }
licence = "eurostat-reuse"

[[dataset]]
id = "eu_lfs2021_occupation_education"
source = "eurostat"
code = "lfsa_egised"               # employed persons by occupation and educational attainment level
filters = { geo = ["EU27_2020"], time = ["2021"], age = ["Y_GE15"], sex = ["F", "M"] }
licence = "eurostat-reuse"

# Census 2021 round, all 42 counties. Inputs of normalise_census_housing.py
# (spec society/population-housing).
[[dataset]]
id = "ro_census2021_locality_size"
source = "eurostat"
code = "cens_21l_r3"               # population by size of the locality, age group, sex and NUTS 3 region
filters = { sex = ["F", "M"], unit = ["NR"], geo = ["RO111", "RO112", "RO113", "RO114", "RO115", "RO116", "RO121", "RO122", "RO123", "RO124", "RO125", "RO126", "RO211", "RO212", "RO213", "RO214", "RO215", "RO216", "RO221", "RO222", "RO223", "RO224", "RO225", "RO226", "RO311", "RO312", "RO313", "RO314", "RO315", "RO316", "RO317", "RO321", "RO322", "RO411", "RO412", "RO413", "RO414", "RO415", "RO421", "RO422", "RO423", "RO424"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_census2021_households_tenure"
source = "eurostat"
code = "cens_21hhct_r3"            # private households by household composition, tenure status and NUTS 3 region
filters = { unit = ["NR"], geo = ["RO111", "RO112", "RO113", "RO114", "RO115", "RO116", "RO121", "RO122", "RO123", "RO124", "RO125", "RO126", "RO211", "RO212", "RO213", "RO214", "RO215", "RO216", "RO221", "RO222", "RO223", "RO224", "RO225", "RO226", "RO311", "RO312", "RO313", "RO314", "RO315", "RO316", "RO317", "RO321", "RO322", "RO411", "RO412", "RO413", "RO414", "RO415", "RO421", "RO422", "RO423", "RO424"] }
licence = "eurostat-reuse"

# Structure of Earnings Survey 2022 (enterprises with 10 employees or more, NACE B to S),
# national accounts and the minimum wage. Inputs of normalise_earnings.py
# (spec society/population-wages). The survey gives proportions only; the level
# is the wage bill of the national accounts in the last quarter of 2021.
[[dataset]]
id = "ro_ses2022_earnings_occupation"
source = "eurostat"
code = "earn_ses22_48"             # mean monthly earnings by sex, occupation and economic activity
filters = { geo = ["RO"], unit = ["NAC"], indic_se = ["ERN"], sizeclas = ["GE10"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_ses2022_earnings_age"
source = "eurostat"
code = "earn_ses22_20"             # mean monthly earnings by sex, age and economic activity
filters = { geo = ["RO"], unit = ["NAC"], indic_se = ["ERN"], sizeclas = ["GE10"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_ses2022_earnings_education"
source = "eurostat"
code = "earn_ses22_23"             # mean monthly earnings by sex, economic activity and educational attainment
filters = { geo = ["RO"], unit = ["NAC"], indic_se = ["ERN"], sizeclas = ["GE10"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_ses2022_employees_occupation"
source = "eurostat"
code = "earn_ses22_54"             # employees by sex, economic activity and occupation
filters = { geo = ["RO"], sizeclas = ["GE10"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_ses2022_employees_age"
source = "eurostat"
code = "earn_ses22_02"             # employees by sex, age and economic activity
filters = { geo = ["RO"], sizeclas = ["GE10"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_ses2022_employees_education"
source = "eurostat"
code = "earn_ses22_04"             # employees by sex, economic activity and educational attainment
filters = { geo = ["RO"], sizeclas = ["GE10"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_ses2022_earnings_quantiles"
source = "eurostat"
code = "earn_ses22_mdeci"          # monthly earnings by quantiles and contractual working time, NACE B to S excluding O
filters = { geo = ["RO"], unit = ["NAC"], worktime = ["TOTAL"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_na_wages_2021q4"
source = "eurostat"
code = "namq_10_a10"               # gross value added and income by main industry, quarterly
filters = { geo = ["RO"], time = ["2021-Q4"], unit = ["CP_MNAC"], na_item = ["D11"], s_adj = ["NSA"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_minimum_wage"
source = "eurostat"
code = "earn_mw_cur"               # monthly minimum wages, twice a year
filters = { geo = ["RO"], time = ["2021-S2", "2022-S2"], currency = ["NAC"] }
licence = "eurostat-reuse"

# Pensions. Inputs of normalise_pensions.py (spec society/population-pensions).
[[dataset]]
id = "ro_pensions_expenditure_2021"
source = "eurostat"
code = "spr_exp_pens"              # expenditure on pensions by type of pension and means-testing
filters = { geo = ["RO"], time = ["2021"], unit = ["MIO_NAC"], spdepm = ["TOTAL"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_pension_gender_gap"
source = "eurostat"
code = "ilc_pnp13"                 # average gender pension gap by age group (EU-SILC)
filters = { geo = ["RO"], time = ["2021"], age = ["Y_GE65"] }
licence = "eurostat-reuse"

[[dataset]]
id = "ro_pension_replacement_ratio"
source = "eurostat"
code = "ilc_pnp3"                  # aggregate replacement ratio for pensions by sex (EU-SILC)
filters = { geo = ["RO"], time = ["2021"] }
licence = "eurostat-reuse"
