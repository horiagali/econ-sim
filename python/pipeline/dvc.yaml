# DVC pipeline (ADR-0012). Run from python/pipeline: `dvc repro`.
stages:
  fetch:
    cmd: python fetch_eurostat.py
    deps: [fetch_eurostat.py, sources.toml]
    outs: [data/raw]
  normalise_census:
    cmd: python normalise_census.py
    deps: [normalise_census.py, jsonstat.py, data/raw/ro_census2021_persons_hhstatus.json, data/raw/ro_census2021_households_size.json]
    outs: [data/derived/census2021_margins_ro.json]
  normalise_census_attributes:
    cmd: python normalise_census_attributes.py
    deps: [normalise_census_attributes.py, normalise_census.py, jsonstat.py, data/raw/ro_census2021_activity_age.json, data/raw/ro_census2021_activity_education.json, data/raw/ro_census2021_persons_hhstatus.json, data/derived/census2021_margins_ro.json]
    outs: [data/derived/census2021_edu_activity_ro.json]
  normalise_inactivity_enrolment:
    cmd: python normalise_inactivity_enrolment.py
    deps: [normalise_inactivity_enrolment.py, normalise_census.py, jsonstat.py, data/raw/ro_enrolment_level_age_2021_22.json, data/derived/census2021_edu_activity_ro.json]
    outs: [data/derived/inactivity_enrolment2021_ro.json]
  normalise_census_jobs:
    cmd: python normalise_census_jobs.py
    deps: [normalise_census_jobs.py, normalise_census_attributes.py, normalise_census.py, jsonstat.py, data/raw/ro_census2021_employment_industry.json, data/raw/ro_census2021_employment_occupation.json, data/raw/eu_lfs2021_occupation_industry.json, data/raw/eu_lfs2021_occupation_education.json, data/derived/census2021_edu_activity_ro.json]
    outs: [data/derived/census2021_jobs_ro.json]
  normalise_census_housing:
    cmd: python normalise_census_housing.py
    deps: [normalise_census_housing.py, normalise_census_attributes.py, normalise_census.py, jsonstat.py, data/raw/ro_census2021_locality_size.json, data/raw/ro_census2021_households_tenure.json, data/derived/census2021_margins_ro.json]
    outs: [data/derived/census2021_housing_ro.json]
  normalise_earnings:
    cmd: python normalise_earnings.py
    deps: [normalise_earnings.py, normalise_census_jobs.py, normalise_census.py, jsonstat.py, data/raw/ro_ses2022_earnings_occupation.json, data/raw/ro_ses2022_earnings_age.json, data/raw/ro_ses2022_earnings_education.json, data/raw/ro_ses2022_employees_occupation.json, data/raw/ro_ses2022_employees_age.json, data/raw/ro_ses2022_employees_education.json, data/raw/ro_ses2022_earnings_quantiles.json, data/raw/ro_na_wages_2021q4.json, data/raw/ro_minimum_wage.json]
    outs: [data/derived/earnings2021_ro.json]
  normalise_pensions:
    cmd: python normalise_pensions.py
    deps: [normalise_pensions.py, normalise_earnings.py, normalise_census_jobs.py, normalise_census.py, jsonstat.py, data/raw/ro_pensions_expenditure_2021.json, data/raw/ro_pension_gender_gap.json, data/raw/ro_pension_replacement_ratio.json, data/raw/ro_ses2022_earnings_education.json, data/derived/earnings2021_ro.json, data/derived/census2021_edu_activity_ro.json]
    outs: [data/derived/pensions2021_ro.json]
  normalise_wealth:
    cmd: python normalise_wealth.py
    deps: [normalise_wealth.py, normalise_census.py, jsonstat.py, data/raw/ro_household_balance_sheet_2021q4.json, data/raw/ro_household_dwellings_2021.json, data/raw/hu_wealth_pattern_2020.json]
    outs: [data/derived/household_wealth2021_ro.json]
  normalise_incomes:
    cmd: python normalise_incomes.py
    deps: [normalise_incomes.py, normalise_census_jobs.py, normalise_census.py, jsonstat.py, data/raw/ro_household_mixed_income_2021q4.json, data/raw/ro_household_mixed_income_2021.json, data/raw/ro_na_agriculture_2021.json, data/derived/earnings2021_ro.json]
    outs: [data/derived/other_incomes2021_ro.json]
  normalise_io:
    cmd: python normalise_io.py
    deps: [normalise_io.py, normalise_census_jobs.py, normalise_census.py, jsonstat.py, data/raw/figaro_2021_used_in_ro.json, data/raw/figaro_2021_made_in_ro.json, data/raw/ro_exchange_rate_2021.json]
    outs: [data/derived/io_table2021_ro.json]
  normalise_balance_sheets:
    cmd: python normalise_balance_sheets.py
    deps: [normalise_balance_sheets.py, normalise_census.py, jsonstat.py, data/raw/ro_balance_sheets_2021q4.json]
    outs: [data/derived/balance_sheets2021q4_ro.json]
  normalise_firms:
    cmd: python normalise_firms.py
    deps: [normalise_firms.py, normalise_census.py, jsonstat.py, data/raw/ro_enterprises_by_size_2021.json, data/raw/ro_foreign_controlled_2021.json, data/derived/io_table2021_ro.json, data/derived/budget2021_ro.json]
    outs: [data/derived/firm_units2021_ro.json]
  normalise_sector_details:
    cmd: python normalise_sector_details.py
    deps: [normalise_sector_details.py, data/derived/balance_sheets2021q4_ro.json]
    outs: [data/derived/sector_details2021_ro.json]
  normalise_firm_balance_sheets:
    cmd: python normalise_firm_balance_sheets.py
    deps: [normalise_firm_balance_sheets.py, normalise_census.py, jsonstat.py, data/raw/ro_capital_stock_2021.json, data/derived/firm_units2021_ro.json, data/derived/balance_sheets2021q4_ro.json]
    outs: [data/derived/firm_balance_sheets2021_ro.json]
  normalise_budget:
    cmd: python normalise_budget.py
    deps: [normalise_budget.py, normalise_census.py, jsonstat.py, data/raw/ro_gov_expenditure_cofog_2021.json, data/raw/ro_gov_main_aggregates_2021.json, data/raw/ro_gdp_2021.json]
    outs: [data/derived/budget2021_ro.json]
  normalise_firm_undeclared_inventories:
    cmd: python normalise_firm_undeclared_inventories.py
    deps: [normalise_firm_undeclared_inventories.py, ../reference/firm_reference.py, normalise_census.py, jsonstat.py, data/raw/ro_inventories_2021.json, data/derived/firm_units2021_ro.json, data/derived/io_table2021_ro.json, data/derived/other_incomes2021_ro.json]
    outs: [data/derived/firm_undeclared_inventories2021_ro.json]
  # The population generator (spec society/population-generator) and its stages
  # C to J (education and activity, jobs, locality size and tenure, wages, pensions,
  # wealth, incomes, employers). It is Rust
  # (crate econ-popgen), run through econ-cli; sample_scale comes from the scenario.
  synth_population:
    cmd: cargo run -q --release -p econ-cli -- synth-population --margins data/derived/census2021_margins_ro.json --attributes data/derived/census2021_edu_activity_ro.json --jobs data/derived/census2021_jobs_ro.json --housing data/derived/census2021_housing_ro.json --wages data/derived/earnings2021_ro.json --pensions data/derived/pensions2021_ro.json --wealth data/derived/household_wealth2021_ro.json --incomes data/derived/other_incomes2021_ro.json --employers data/derived/firm_units2021_ro.json --sample-scale 100 --seed 42 --out data/population
    deps: [data/derived/census2021_margins_ro.json, data/derived/census2021_edu_activity_ro.json, data/derived/census2021_jobs_ro.json, data/derived/census2021_housing_ro.json, data/derived/earnings2021_ro.json, data/derived/pensions2021_ro.json, data/derived/household_wealth2021_ro.json, data/derived/other_incomes2021_ro.json, data/derived/firm_units2021_ro.json, ../../crates/econ-popgen/src, ../../crates/econ-io/src/popgen.rs]
    outs: [data/population]
  # Spike 7 slice on illustrative marginals; superseded by synth_population.
  synth:
    cmd: python synth_counties.py --fixture --scale 100
    deps: [synth_counties.py, ipf.py, fixtures/marginals_illustrative.json]
    outs: [data/derived/population_fixture_1to100.csv, data/derived/population_fixture_1to100.provenance.json]
