# DVC pipeline (ADR-0012). Run from python/pipeline: `dvc repro`.
stages:
  fetch:
    cmd: python fetch_eurostat.py
    deps: [fetch_eurostat.py, sources.toml]
    outs: [data/raw]
  normalise_census:
    cmd: python normalise_census.py
    deps: [normalise_census.py, jsonstat.py, data/raw/ro_census2021_persons_hhstatus.json, data/raw/ro_census2021_households_size.json]
    outs: [data/derived/census2021_margins_ro.json]
  normalise_census_attributes:
    cmd: python normalise_census_attributes.py
    deps: [normalise_census_attributes.py, normalise_census.py, jsonstat.py, data/raw/ro_census2021_activity_age.json, data/raw/ro_census2021_activity_education.json, data/raw/ro_census2021_persons_hhstatus.json, data/derived/census2021_margins_ro.json]
    outs: [data/derived/census2021_edu_activity_ro.json]
  normalise_census_jobs:
    cmd: python normalise_census_jobs.py
    deps: [normalise_census_jobs.py, normalise_census_attributes.py, normalise_census.py, jsonstat.py, data/raw/ro_census2021_employment_industry.json, data/raw/ro_census2021_employment_occupation.json, data/raw/eu_lfs2021_occupation_industry.json, data/raw/eu_lfs2021_occupation_education.json, data/derived/census2021_edu_activity_ro.json]
    outs: [data/derived/census2021_jobs_ro.json]
  normalise_census_housing:
    cmd: python normalise_census_housing.py
    deps: [normalise_census_housing.py, normalise_census_attributes.py, normalise_census.py, jsonstat.py, data/raw/ro_census2021_locality_size.json, data/raw/ro_census2021_households_tenure.json, data/derived/census2021_margins_ro.json]
    outs: [data/derived/census2021_housing_ro.json]
  # The population generator (spec society/population-generator) and its stages
  # C, D and E (education and activity, jobs, locality size and tenure). It is Rust
  # (crate econ-popgen), run through econ-cli; sample_scale comes from the scenario.
  synth_population:
    cmd: cargo run -q --release -p econ-cli -- synth-population --margins data/derived/census2021_margins_ro.json --attributes data/derived/census2021_edu_activity_ro.json --jobs data/derived/census2021_jobs_ro.json --housing data/derived/census2021_housing_ro.json --sample-scale 100 --seed 42 --out data/population
    deps: [data/derived/census2021_margins_ro.json, data/derived/census2021_edu_activity_ro.json, data/derived/census2021_jobs_ro.json, data/derived/census2021_housing_ro.json, ../../crates/econ-popgen/src, ../../crates/econ-io/src/popgen.rs]
    outs: [data/population]
  # Spike 7 slice on illustrative marginals; superseded by synth_population.
  synth:
    cmd: python synth_counties.py --fixture --scale 100
    deps: [synth_counties.py, ipf.py, fixtures/marginals_illustrative.json]
    outs: [data/derived/population_fixture_1to100.csv, data/derived/population_fixture_1to100.provenance.json]
